[options]
; ==============================================================================
; AlamiaTravelOS - Odoo 19 Configuration
; ==============================================================================

; Paths to addons directories (internal odoo addons + custom + 3rd party)
addons_path = /mnt/extra-addons,/mnt/third-party-addons,/usr/lib/python3/dist-packages/odoo/addons

; Data directory for filestore & sessions
data_dir = /var/lib/odoo

; Master Password for database operations (create, drop, backup, restore)
admin_passwd = admin

; Database Connection Settings (Can also be overridden by env variables)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64

; Server / Proxy configuration (Enables X-Forwarded-* headers for Nginx / Traefik SSL)
proxy_mode = True

; HTTP & WebSocket / Longpolling ports
http_port = 8069
gevent_port = 8072

; Workers (Set to 0 for local dev with live reloading/debugging. On VPS, set workers = (CPU * 2) + 1)
workers = 0

; Memory & Time Limits (Adjust based on VPS size)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Logging
log_level = info
log_handler = [':INFO']
