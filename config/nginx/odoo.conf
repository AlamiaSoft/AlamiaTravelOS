# ==============================================================================
# AlamiaTravelOS - Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream odoo {
    server web:8069;
}

upstream odoochat {
    server web:8072;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name travelos.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name travelos.example.com;

    # SSL Certificates (Let's Encrypt path)
    ssl_certificate /etc/letsencrypt/live/travelos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelos.example.com/privkey.pem;

    ssl_session_timeout 30m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Proxy headers
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    # Max upload size (for attachments, invoices, large spreadsheets)
    client_max_body_size 128M;

    # WebSocket / Longpolling requests
    location /websocket {
        proxy_pass http://odoochat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /longpolling {
        proxy_pass http://odoochat;
    }

    # Standard Odoo Web Requests
    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    # Cache static files
    location ~* /[^/]+/static/ {
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
        proxy_pass http://odoo;
    }

    # Gzip Compression
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;
    gzip on;
}
