# Production Docker Compose for Hetzner / Oracle Cloud VPS
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: alamia-odoo:19.0
    container_name: alamiatravelos_web_prod
    command:
      - "--dev=reload,xml"
      - "-d"
      - "alamiatravelos"
      - "--db-filter=^alamiatravelos$$"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8069}:8069"
      - "${CHAT_PORT:-8072}:8072"
    environment:
      - HOST=${DB_HOST:-db}
      - PORT=${DB_PORT:-5432}
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:-odoo}
    volumes:
      - odoo-web-data:/var/lib/odoo
    restart: always
    networks:
      - odoo-prod-network

  db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: alamiatravelos_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - odoo-prod-network

