# Production Docker Compose for Hetzner / Oracle Cloud VPS
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: alamia-odoo:19.0
    container_name: alamiatravelos_web_prod
    command:
      - "--dev=reload,xml"
      - "-d"
      - "alamiatravelos"
      - "--db-filter=^alamiatravelos$$"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8069}:8069"
      - "${CHAT_PORT:-8072}:8072"
    environment:
      - HOST=${DB_HOST:-db}
      - PORT=${DB_PORT:-5432}
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:-odoo}
    volumes:
      - odoo-web-data:/var/lib/odoo
    restart: always
    networks:
      - odoo-prod-network

  db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: alamiatravelos_db_prod
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER:-odoo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-odoo}
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/local/bin/docker-entrypoint.sh postgres &
        PID=$$!
        (
          until psql -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1 || psql -U odoo -d postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 1; done
          psql -U postgres -d postgres -c "CREATE USER odoo WITH PASSWORD 'odoo' SUPERUSER CREATEDB CREATEROLE;" >/dev/null 2>&1 || true
          psql -U postgres -d postgres -c "ALTER USER odoo WITH PASSWORD 'odoo';" >/dev/null 2>&1 || true
          psql -U odoo -d postgres -c "ALTER USER odoo WITH PASSWORD 'odoo';" >/dev/null 2>&1 || true
        ) &
        wait $$PID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - odoo-prod-network

volumes:
  odoo-web-data:
    name: alamiatravelos_prod_web_data
  odoo-db-data:
    name: alamiatravelos_prod_db_data

networks:
  odoo-prod-network:
    name: alamiatravelos_prod_network
    driver: bridge